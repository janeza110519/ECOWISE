<!DOCTYPE html>
<html>
<head>
  <title>EcoWise Login</title>
  <style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial;
    background:#2ecc71;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.container{
    width:100%;
    max-width:900px;
    display:flex;
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 0 15px rgba(0,0,0,0.3);
}

.left{
    width:40%;
    background:#0f6b5b;
    color:white;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:40px;
}

.left img{
    width:120px;
    margin-bottom:15px;
}

.right{
    width:60%;
    padding:40px;
    background:#2ecc71;
}

.right h1{
    margin-bottom:20px;
    color:white;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:8px;
    outline:none;
}

button,
input[type="submit"]{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:8px;
    background:#0f6b5b;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover,
input[type="submit"]:hover{
    background:#095346;
}

/* RESPONSIVE */

@media(max-width:768px){

.container{
    flex-direction:column;
}

.left{
    width:100%;
    padding:30px;
}

.right{
    width:100%;
}

}

</style>
</head>

<body>

<div class="container">
  
  <div class="left">
    <img src="logo.jpg">
    <h2><i>EcoWise</i></h2>
  </div>

  <div class="right">
    <form method="POST" action="login.php">

      <h3>Username</h3>
      <input type="text" name="username" required>

      <h3>Password</h3>
      <input type="password" name="password" required>

      <button type="submit"><b>Login</b></button>
    </form>

    <a href="register.html">
      <button type="button"><b>Sign Up</b></button>
    </a>
  </div>

</div>

<script>
  
function goRegister() {
  window.location.href = "register.html";
}
</script>

</body>
</html>
