<!DOCTYPE html>
<html>
<head>
  <title>EcoWise Register</title>
  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #2ecc71;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      display: flex;
      width: 600px;
      background: #2ecc71;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }

    .left {
      width: 40%;
      background: #0f6b5b;
      color: white;
      text-align: center;
      padding: 30px;
    }

    .left img {
      width: 100px;
    }

    .right {
      width: 60%;
      padding: 30px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
    }

    button {
      padding: 10px 20px;
      margin: 10px 5px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="container">
  
  <!-- LEFT SIDE -->
  <div class="left">
    <img src="logo.png">
    <h2>EcoWise</h2>
  </div>

  <!-- RIGHT SIDE -->
  <div class="right">
    <h3>Fullname</h3>
    <input type="text" id="fullname">

    <h3>Username</h3>
    <input type="text" id="username">

    <h3>Password</h3>
    <input type="password" id="password">

    <h3>Confirm Password</h3>
    <input type="password" id="confirmPassword">

    <button onclick="register()"><b>Sign In</b></button>
    <button onclick="goLogin()"><b>Back to Login</b></button>
  </div>

</div>

<script>
function register() {
  let username = document.getElementById("username").value;
  let password = document.getElementById("password").value;
  let confirm = document.getElementById("confirmPassword").value;

  if (password !== confirm) {
    alert("Password do not match");
    return;
  }

  fetch("http://localhost/ecoweb/register.php", {
    method: "POST",
    headers: {
      "Content-Type": "application/x-www-form-urlencoded"
    },
    body: `username=${username}&password=${password}`
  })
  .then(res => res.text())
  .then(data => {
    if(data === "Success") {
      alert("Registered!");
      window.location.href = "login.html";
    } else if (data === "exist") {
      alert("Username already exists!");
    } else {
      alert("Error!");
    }
  });
}
</script>

</body>
</html>
